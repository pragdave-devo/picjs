<svg viewBox="0 0 880 340" width="880" height="340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #0969da; }
    .frame { fill: #fff; stroke: #d0d7de; stroke-width: 1; rx: 6; }
    a:hover .frame { stroke: #0969da; stroke-width: 2; }
    a:hover .label { text-decoration: underline; }
  </style>

  <!-- Row 1 -->
  <a xlink:href="https://pragdave-devo.github.io/picjs/?example=architecture" target="_blank">
    <rect class="frame" x="16" y="16" width="128" height="128"/>
    <image xlink:href="architecture.svg" x="20" y="20" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>
    <text class="label" x="80" y="162" text-anchor="middle">Architecture</text>
  </a>

