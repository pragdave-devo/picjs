<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 20px; font-family: sans-serif; }
.picjs { white-space: pre; font-family: monospace; }
</style>
</head>
<body>
<div id="diagrams"></div>
<script type="module">
import { renderAll } from "../../src/index.ts"

window.renderDiagram = function(source) {
  const container = document.getElementById('diagrams')
  container.innerHTML = ''
  const el = document.createElement('div')
  el.className = 'picjs'
  el.textContent = source
  container.appendChild(el)
  const results = renderAll('.picjs')
  return results[0] || null
}

window.renderMultiple = function(sources) {
  const container = document.getElementById('diagrams')
  container.innerHTML = ''
  for (const source of sources) {
    const el = document.createElement('div')
    el.className = 'picjs'
    el.textContent = source
    container.appendChild(el)
  }
  return renderAll('.picjs')
}

window.__ready = true
</script>
</body>
</html>
